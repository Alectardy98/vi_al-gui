name: Vi_al native releases
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
          - os: windows-2025
            label: windows-x86_64
          - os: macos-15
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0 libxcb-xinerama0 libxkbcommon-x11-0 libegl1 libfuse2
          python util/packaging/fetch_appimage_tools.py
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: python -m pip install -r util/packaging/requirements-build.txt
      - run: python util/packaging/build_native.py
      - run: python util/packaging/build_addons.py
      - name: Build core without add-on sources
        shell: bash
        run: |
          mv addons addons.not-required
          python util/packaging/build.py
          mv addons.not-required addons
      - name: Build bundled edition
        run: python util/packaging/build.py --with-addons
      - if: runner.os == 'Windows'
        run: |
          python util/packaging/fetch_nsis.py
          python util/packaging/build_windows_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: Vi_al-native-${{ matrix.label }}
          path: |
            artifacts/**/with-addons/Vi_al*.AppImage
            artifacts/**/with-addons/Vi_al*.tar.gz
            artifacts/**/with-addons/Vi_al*.zip
            artifacts/**/with-addons/Vi_al*.dmg
            artifacts/**/with-addons/Vi_al*Setup.exe
            artifacts/**/with-addons/manifest.json
  release-downloads:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: Vi_al-native-*
          path: native-builds
      - run: python util/packaging/assemble_release.py --input native-builds --output release-downloads --require-all
      - uses: actions/upload-artifact@v4
        with:
          name: Vi_al-release-downloads
          path: release-downloads/
