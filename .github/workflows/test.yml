name: Vi_al tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libusb-1.0-0
      - run: python -m pip install -r test-requirements.txt
      - env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src/main/python
        run: python -m pytest tests src/main/python/test -q
